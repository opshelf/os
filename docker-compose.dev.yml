services:
  api:
    volumes:
      - ./perpetual_hardware/packages/hardware/src/hardware:/app/perpetual_hardware/packages/hardware/src/hardware
      - ./perpetual_hardware/packages/openshelf_os/src/openshelf_os:/app/perpetual_hardware/packages/openshelf_os/src/openshelf_os
      - ./perpetual_hardware/packages/openshelf_os_server/src/openshelf_os_server:/app/perpetual_hardware/packages/openshelf_os_server/src/openshelf_os_server
    environment:
      - UVICORN_RELOAD=true

  dev_ui:
    build:
      context: ./dev_ui
      dockerfile: Dockerfile.dev
    volumes:
      - ./dev_ui/src:/app/src
