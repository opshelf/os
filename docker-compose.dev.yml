services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    image: ${OPSHELF_REGISTRY:-registry.opshelf.com}/opshelf/openshelf_os_api_dev:latest
    volumes:
      - ./openshelf_hardware/packages/hardware/src/hardware:/app/openshelf_hardware/packages/hardware/src/hardware
      - ./openshelf_hardware/packages/openshelf_os/src/openshelf_os:/app/openshelf_hardware/packages/openshelf_os/src/openshelf_os
      - ./openshelf_hardware/packages/openshelf_os_server/src/openshelf_os_server:/app/openshelf_hardware/packages/openshelf_os_server/src/openshelf_os_server
    environment:
      - UVICORN_RELOAD=${UVICORN_RELOAD:-true}
    command:
      - /app/openshelf_hardware/.venv/bin/python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -c
      - from openshelf_os_server.launcher import start; start()


  dev_ui:
    build:
      context: ./dev_ui
      dockerfile: Dockerfile.dev
    image: ${OPSHELF_REGISTRY:-registry.opshelf.com}/opshelf/openshelf_os_dev_ui_dev:latest
    volumes:
      - ./dev_ui/src:/app/src
