services:
  api:
    volumes:
      - ./openshelf_hardware/packages/hardware/src/hardware:/app/openshelf_hardware/packages/hardware/src/hardware
      - ./openshelf_hardware/packages/openshelf_os/src/openshelf_os:/app/openshelf_hardware/packages/openshelf_os/src/openshelf_os
      - ./openshelf_hardware/packages/openshelf_os_server/src/openshelf_os_server:/app/openshelf_hardware/packages/openshelf_os_server/src/openshelf_os_server
    environment:
      - UVICORN_RELOAD=true
    command: python -m debugpy --listen 0.0.0.0:5678 -m uvicorn main:app --host 0.0.0.0 --port 8000


  dev_ui:
    build:
      context: ./dev_ui
      dockerfile: Dockerfile.dev
    volumes:
      - ./dev_ui/src:/app/src
