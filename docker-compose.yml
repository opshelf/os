name: perpetual_os

services:
  nats:
    image: nats:latest
    network_mode: "host"
    volumes:
      - ./perpetual_hardware/packages/perpetual_os1_server/infra/nats/:/etc/nats/
    command: ["-js", "-config", "/etc/nats/nats.conf"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    network_mode: "host"
    volumes:
      - ./perpetual_hardware/:/app/perpetual_hardware/
    depends_on:
      - nats
    environment:
      - ENV=dev
      - PERPETUAL_BARCODE_PORT=/dev/ttyACM0
      - PERPETUAL_BARCODE_BAUDRATE=115200
      - NATS_DOMAIN=nats
      - JWT_SECRET=${JWT_SECRET:-INSECURE_JWT_SECRET}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:-INSECURE_AUDIT_HMAC_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  ui:
    build:
      context: ./openshelf_os1
      dockerfile: ./Dockerfile
    network_mode: "host"
    volumes:
      - ./openshelf_os1/:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
