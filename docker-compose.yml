name: perpetual_os

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ./perpetual_hardware/packages/perpetual_os1_server/infra/nats/:/etc/nats/
    command: ["-js", "-config", "/etc/nats/nats.conf"]
    healthcheck:
      test: [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8222/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - openshelf-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./perpetual_hardware/:/app/perpetual_hardware/
    ports:
      - "8000:8000"
    depends_on:
      - nats
    environment:
      - ENV=dev
      - PERPETUAL_BARCODE_PORT=/dev/ttyACM0
      - PERPETUAL_BARCODE_BAUDRATE=115200
      - JWT_SECRET=${JWT_SECRET:-INSECURE_JWT_SECRET}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:-INSECURE_AUDIT_HMAC_KEY}
      - NATS_DOMAIN=nats
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    networks:
      - openshelf-network
    restart: unless-stopped

  ui:
    build:
      context: ../openshelf_ui
      dockerfile: Dockerfile
      args:
        PUBLIC_DEPLOYMENT_ENVIRONMENT: production
        PUBLIC_DEFAULT_API_BASE: http://localhost:8000/api
    ports:
      - "8888:8888"
    environment:
      - PUBLIC_DEPLOYMENT_ENVIRONMENT=production
      - PUBLIC_DEFAULT_API_BASE=http://localhost:8000/api
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - openshelf-network

networks:
  openshelf-network:
