services:
  nats:
    image: nats:latest
    container_name: nats
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ./perpetual_hardware/packages/perpetual_os1_server/infra/nats/:/etc/nats/
    command: ["-js", "-config", "/etc/nats/nats.conf"]
    networks:
      - openshelf-network

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./perpetual_hardware/packages/perpetual_os1_server/data/:/app/perpetual_hardware/packages/perpetual_os1_server/data/
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    ports:
      - "8000:8000"
    depends_on:
      - nats
    environment:
      - ENV=dev
    networks:
      - openshelf-network

  ui:
    build:
      context: ./openshelf_os1
      dockerfile: ./Dockerfile
    ports:
      - "0.0.0.0:8080:5173"
    volumes:
      - ./openshelf_os1/:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - openshelf-network

networks:
  openshelf-network:
