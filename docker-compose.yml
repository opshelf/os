services:
  nats:
    image: nats:latest
    container_name: nats
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ./perpetual_hardware/packages/perpetual-os1-server/infra/nats/:/etc/nats/
    command: ["-js", "-config", "/etc/nats/nats.conf"]
    networks:
      - my-network

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./perpetual_hardware/packages/perpetual-os1-server/data/:/app/perpetual_hardware/packages/perpetual-os1-server/data/
    ports:
      - "8000:8000"
    depends_on:
      - nats
    networks:
      - my-network

  ui:
    build:
      context: ./openshelf_os1
      dockerfile: ./Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./openshelf_os1/:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - my-network

networks:
  my-network:
