# Every checkout shares this project name, so starting one replaces another
# checkout's containers. Set OPSHELF_COMPOSE_PROJECT per worktree to keep stacks
# separate; the default keeps device and relay tooling on openshelf_os-*.
name: ${OPSHELF_COMPOSE_PROJECT:-openshelf_os}

services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ${OPSHELF_REGISTRY:-registry.opshelf.com}/opshelf/openshelf_os_api:latest
    pull_policy: build
    network_mode: "host"
    volumes:
      - /etc/cups:/etc/cups:ro
      - /etc/opshelf:/etc/opshelf:ro
      - ./openshelf_hardware/data:/app/openshelf_hardware/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /boot/firmware:/boot/firmware
    environment:
      - ENV=${ENV:-dev}
      - MODBUS_TRACE=${MODBUS_TRACE:-false}
      - CRASH_RECORDER_ENABLED=${CRASH_RECORDER_ENABLED:-true}
      - CRASH_RECORDER_LOOKBACK_SECONDS=${CRASH_RECORDER_LOOKBACK_SECONDS:-15}
      - CRASH_RECORDER_FPS=${CRASH_RECORDER_FPS:-3}
      - CRASH_RECORDER_MAX_WIDTH=${CRASH_RECORDER_MAX_WIDTH:-640}
      - CRASH_RECORDER_MAX_CAMERA_BUFFER_MIB=${CRASH_RECORDER_MAX_CAMERA_BUFFER_MIB:-16}
      - CRASH_RECORDER_MAX_ATTACHMENT_MIB=${CRASH_RECORDER_MAX_ATTACHMENT_MIB:-4}
      - CRASH_RECORDER_MAX_TOTAL_ATTACHMENT_MIB=${CRASH_RECORDER_MAX_TOTAL_ATTACHMENT_MIB:-14}
      - OPERATING_MODE=${OPERATING_MODE:-development}
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-development}
      - OPENSHELF_CONFIG_PATH=${OPENSHELF_CONFIG_PATH:-}
      - DEVICE_ID=${DEVICE_ID:-}
      - OPENSHELF_BARCODE_PORT
      - OPENSHELF_BARCODE_BAUDRATE=115200
      # Passed through only when set; settings.py otherwise keeps the persisted
      # auth.jwt_secret or generates a strong one, so no weak default is injected.
      - JWT_SECRET
      # Passed through only when set; scripts/start provisions a per-mode key when
      # unset, so no weak default is injected. AUDIT_HMAC_KEY_ID must reach the
      # container with its key or rotated audit rows verify against the wrong key.
      - AUDIT_HMAC_KEY
      - AUDIT_HMAC_KEY_ID
      - OPSHELF_RELAY_SERVICE_TOKEN_SHA256=${OPSHELF_RELAY_SERVICE_TOKEN_SHA256:-}
      - CAS_COMMON_CHEMISTRY_API_KEY=${CAS_COMMON_CHEMISTRY_API_KEY:-}
      - SENTRY_DSN_API=${SENTRY_DSN_API:-}
      - SENTRY_DSN_HARDWARE=${SENTRY_DSN_HARDWARE:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - OPSHELF_UID=${OPSHELF_UID:-}
      - OPSHELF_GID=${OPSHELF_GID:-}
      - OPSHELF_DIALOUT_GID=${OPSHELF_DIALOUT_GID:-}
      - OPSHELF_VIDEO_GID=${OPSHELF_VIDEO_GID:-}
      - OPSHELF_INPUT_GID=${OPSHELF_INPUT_GID:-}
      - OPSHELF_RENDER_GID=${OPSHELF_RENDER_GID:-}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://localhost:8000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  dev_ui:
    build:
      context: ./dev_ui
      dockerfile: Dockerfile
    image: ${OPSHELF_REGISTRY:-registry.opshelf.com}/opshelf/openshelf_os_dev_ui:latest
    pull_policy: build
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
