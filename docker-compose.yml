name: openshelf_os

services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    network_mode: "host"
    volumes:
      - /etc/cups:/etc/cups:ro
      - /etc/opshelf:/etc/opshelf:ro
      - ./openshelf_hardware/data:/app/openshelf_hardware/data
    environment:
      - ENV=${ENV:-dev}
      - OPERATING_MODE=${OPERATING_MODE:-development}
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-development}
      - DEVICE_ID=${DEVICE_ID:-}
      - OPENSHELF_BARCODE_PORT=/dev/ttyACM0
      - OPENSHELF_BARCODE_BAUDRATE=115200
      - JWT_SECRET=${JWT_SECRET:-INSECURE_JWT_SECRET}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:-INSECURE_AUDIT_HMAC_KEY}
      - SENTRY_DSN_API=${SENTRY_DSN_API:-}
      - SENTRY_DSN_HARDWARE=${SENTRY_DSN_HARDWARE:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - OPSHELF_UID=${OPSHELF_UID:-}
      - OPSHELF_GID=${OPSHELF_GID:-}
      - OPSHELF_DIALOUT_GID=${OPSHELF_DIALOUT_GID:-}
      - OPSHELF_VIDEO_GID=${OPSHELF_VIDEO_GID:-}
      - OPSHELF_INPUT_GID=${OPSHELF_INPUT_GID:-}
      - OPSHELF_RENDER_GID=${OPSHELF_RENDER_GID:-}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://localhost:8000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  dev_ui:
    build:
      context: ./dev_ui
      dockerfile: Dockerfile
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    restart: unless-stopped
