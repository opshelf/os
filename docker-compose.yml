name: perpetual_os

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ./perpetual_hardware/packages/perpetual_os1_server/infra/nats/:/etc/nats/
    command: ["-js", "-config", "/etc/nats/nats.conf"]
    networks:
      - openshelf-network

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./perpetual_hardware/:/app/perpetual_hardware/
    ports:
      - "8000:8000"
    depends_on:
      - nats
    environment:
      - ENV=dev
      - PERPETUAL_BARCODE_PORT=/dev/ttyACM0
      - PERPETUAL_BARCODE_BAUDRATE=115200
      - JWT_SECRET=${JWT_SECRET:-INSECURE_JWT_SECRET}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:-INSECURE_AUDIT_HMAC_KEY}
      - NATS_DOMAIN=nats
    networks:
      - openshelf-network

  dev_ui:
    build:
      context: ./dev_ui
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./dev_ui:/app
      - dev_ui_node_modules:/app/node_modules
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - openshelf-network

networks:
  openshelf-network:

volumes:
  dev_ui_node_modules:
