name: perpetual_os

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ./perpetual_hardware/packages/perpetual_os1_server/infra/nats/:/etc/nats/
    command: ["-js", "-config", "/etc/nats/nats.conf"]
    networks:
      - openshelf-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    network_mode: "host"
    volumes:
      - ./perpetual_hardware/:/app/perpetual_hardware/
      - /etc/cups:/etc/cups:ro
    depends_on:
      - nats
    environment:
      - ENV=dev
      - PERPETUAL_BARCODE_PORT=/dev/ttyACM0
      - PERPETUAL_BARCODE_BAUDRATE=115200
      - JWT_SECRET=${JWT_SECRET:-INSECURE_JWT_SECRET}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:-INSECURE_AUDIT_HMAC_KEY}
      - NATS_DOMAIN=localhost
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  dev_ui:
    build:
      context: ./dev_ui
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./dev_ui:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - openshelf-network

networks:
  openshelf-network:
