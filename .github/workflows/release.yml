name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch provisioning release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api repos/opshelf/provisioning/dispatches \
            --input - <<'JSON'
          {"event_type": "release"}
          JSON
