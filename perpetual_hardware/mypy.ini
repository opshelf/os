[mypy]
#follow_imports = "silent"
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True

[mypy-serial.*]
ignore_missing_imports = True

[mypy-pylibdmtx.*]
ignore_missing_imports = True

[mypy-serial_asyncio.*]
ignore_missing_imports = True

[mypy-pytrinamic.*]
ignore_missing_imports = True

[mypy-zxingcpp.*]
ignore_missing_imports = True

[mypy-scanner_prototype.*]
ignore_errors = True
