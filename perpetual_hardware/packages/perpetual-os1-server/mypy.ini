[mypy]
# Global mypy configuration
follow_imports = normal
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
enable_error_code = unused-awaitable

# Module-specific configurations
[mypy-fastapi.*]
ignore_missing_imports = False

[mypy-pydantic.*]
ignore_missing_imports = False

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-nats.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-sse_starlette.*]
ignore_missing_imports = True

[mypy-pyserial_asyncio.*]
ignore_missing_imports = True

[mypy-pillow.*]
ignore_missing_imports = True

[mypy-python_barcode.*]
ignore_missing_imports = True

[mypy-argon2_cffi.*]
ignore_missing_imports = True

[mypy-pyjw.*]
ignore_missing_imports = True

[mypy_python_multipart.*]
ignore_missing_imports = True

[mypy-email_validator.*]
ignore_missing_imports = True

[mypy-perpetual_os1.*]
ignore_missing_imports = True

[mypy-perpetual_barcode_scanner.*]
ignore_missing_imports = True

[mypy-perpetual_waveshare.*]
ignore_missing_imports = True

[mypy-perpetual_scale.*]
ignore_missing_imports = True

[mypy-perpetual_os1_server.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-greenlet.*]
ignore_missing_imports = True

[mypy-scanner_prototype.*]
ignore_errors = True