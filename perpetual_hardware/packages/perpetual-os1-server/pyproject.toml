[project]
name = "perpetual-os1-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "emgardner", email = "gardner.ethan10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "nats-py>=2.9.0",
    "pydantic>=2.10.0",
    "perpetual-os1",
    "uvicorn>=0.32.1",
    "pyserial-asyncio>=0.6",
    "setuptools>=75.8.0",
    "sse-starlette>=2.1.3",
    "perpetual-barcode-scanner",
    "perpetual-waveshare",
    "perpetual-scale",
    "python-barcode>=0.15.1",
    "pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
perpetual-os1 = { workspace = true }
perpetual-waveshare = { workspace = true }
perpetual-barcode-scanner = { workspace = true } 
perpetual-scale = { workspace = true } 

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "factory-boy>=3.3.0",
]

[project.scripts]
start = "perpetual_os1_server.main:start"
