[project]
name = "perpetual-os1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "emgardner", email = "gardner.ethan10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
	"python-can",
	"hardware-common",
	"pydantic",
	"waveshare-can",
	"perpetual-trinamic",
	"nats-py>=2.9.0",
	"perpetual-can",
	"pymodbus>=3.8.6",
	"perpetual-waveshare"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hardware-common = { workspace = true }
waveshare-can = { workspace = true }
perpetual-can = { workspace = true }
perpetual-trinamic = { workspace = true }
perpetual-waveshare = { workspace = true }

[tool.mypy]
follow_imports = "normal"
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = "serial_asyncio.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "serial"
ignore_errors = true


[project.entry-points.'can.interface']
waveshare = "waveshare_can:Waveshare"
