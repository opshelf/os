[project]
name = "perpetual-p0c"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"python-can",
	"hardware-common",
	"pydantic",
	"waveshare-can",
	"perpetual-trinamic",
	"nats-py>=2.9.0",
	"perpetual-can"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
hardware-common = { workspace = true }
waveshare-can = { workspace = true }
perpetual-can = { workspace = true }
perpetual-trinamic = { workspace = true }

[tool.mypy]
follow_imports = "normal"
plugins = ['pydantic.mypy']

[project.entry-points.'can.interface']
waveshare = "waveshare_can:Waveshare"
