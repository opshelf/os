[mypy]
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disable_error_code = ["import-untyped"]

[mypy-serial.*]
ignore_missing_imports = True

[mypy-serial_asyncio.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-pylibdmtx.*]
ignore_missing_imports = True
ignore_errors = True

[perpetual-p0c-server.tests.*]
ignore_all = True



