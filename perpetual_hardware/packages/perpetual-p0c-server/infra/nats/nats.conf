jetstream {
  # Store directory for JetStream data
  store_dir: "/data/jetstream"
}

websocket {
  # Enable WebSocket support
  # enable: true
  # WebSocket listening port
  port: 8080
  # WebSocket compression
  compression: true
  # Allowed origins for WebSocket connections
  allowed_origins: [
    "http://localhost",
    "http://127.0.0.1",
    "http://172.18.0.1"
  ]
  no_tls: true
}

# Basic NATS server configuration
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Optional: Configure logging
logtime: true
debug: false
trace: false
