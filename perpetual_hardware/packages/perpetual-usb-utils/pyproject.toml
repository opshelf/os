[project]
name = "perpetual-usb-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "emgardner", email = "gardner.ethan10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
	"pydantic",
        "python-can",
        "waveshare-can",
        "perpetual-can",
        "pyserial-asyncio>=0.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
waveshare-can = { workspace = true }
perpetual-can = { workspace = true }

[project.entry-points.'can.interface']
waveshare = "waveshare_can:Waveshare"
