[project]
name = "perpetual-io-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "emgardner", email = "gardner.ethan10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "nats-py>=2.9.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.1",
    "setuptools>=75.8.0",
    "sse-starlette>=2.1.3",
    "perpetual-camera",
    "opencv-python>=4.11.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
perpetual-camera = { workspace = true }

[project.scripts]
start = "perpetual_io_detection.main:start"
