[project]
name = "perpetual-output-box"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "nats-py>=2.9.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.1",
    "pyserial-asyncio>=0.6",
    "pillow>=11.1.0",
    "pylibdmtx>=0.1.10",
    "setuptools>=75.8.0",
    "sse-starlette>=2.1.3",
    "perpetual-trinamic",
    "hardware-common",
    "pyserial>=3.5",
    "gpiod ; sys_platform == 'linux'",
]
[tool.uv.sources]
hardware-common = { workspace = true }
perpetual-trinamic = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

