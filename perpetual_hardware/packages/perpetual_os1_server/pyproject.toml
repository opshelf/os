[project]
name = "perpetual_os1_server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "emgardner", email = "gardner.ethan10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "nats-py>=2.9.0",
    "pydantic>=2.10.0",
    "perpetual_os1",
    "uvicorn>=0.32.1",
    "pyserial-asyncio>=0.6",
    "setuptools>=75.8.0",
    "sse-starlette>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
perpetual_os1 = { workspace = true }

[project.scripts]
start = "perpetual_os1_server.main:start"
