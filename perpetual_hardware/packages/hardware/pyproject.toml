[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware"]

[project]
name = "opshelf-hardware"
version = "0.1.0"
description = "Openshelf hardware drivers"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.10.0",
    "rpi-lgpio; sys_platform == 'linux'",
    "pymodbus>=3.11.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-mock"]