[project]
name = "opshelf-hardware"
version = "0.1.0"
description = "Openshelf hardware drivers"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.10.0",
    "rpi-lgpio; sys_platform == 'linux'",
]

[tool.pytest.ini_options]
# or [pytest] in pytest.ini
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib"] # Recommended for new projects