version = 1
requires-python = ">=3.12"

[manifest]
members = [
    "messages",
    "perpetual-hardware",
]

[[package]]
name = "bindings"
version = "0.1.0"
source = { directory = "../perpetual_fw/crates/bindings" }

[[package]]
name = "messages"
version = "0.1.0"
source = { virtual = "packages/messages" }
dependencies = [
    { name = "bindings" },
]

[package.metadata]
requires-dist = [{ name = "bindings", directory = "../perpetual_fw/crates/bindings" }]

[[package]]
name = "perpetual-hardware"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "bindings" },
]

[package.metadata]
requires-dist = [{ name = "bindings", directory = "../perpetual_fw/crates/bindings" }]
