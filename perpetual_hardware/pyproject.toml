[project]
name = "perpetual-hardware"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"opencv-python"
]

[tool.uv.workspace]
members = [
	"packages/hardware",
    "packages/perpetual_os1",
    "packages/perpetual_os1_server",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "packages/hardware/src:packages/perpetual_os1/src:packages/perpetual_os1_server/src"
exclude = ["tests/"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "hardware.camera",
    "hardware.iocam",
    "hardware.iocam_helpers",
    "hardware.toolcam",
    "hardware.toolcam_helpers",
]
disable_error_code = ["arg-type", "call-overload", "attr-defined"]
