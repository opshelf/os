[package]
name = "tool_board"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = { version = "0.3.8", optional = true }
defmt-rtt = { version = "0.4.1", optional = true }
embassy-executor = { version = "0.6.3", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-futures = "0.1.1"
embassy-stm32 = { version = "0.1.0", features = ["memory-x", "stm32g474re", "time-driver-any", "exti", "unstable-pac"] }
embassy-sync = "0.6.0"
embassy-time = { version = "0.3.2", features = ["tick-hz-32_768"] }
embedded-can = "0.4.1"
panic-halt = "1.0.0"
panic-probe = { version = "0.3.2", features = ["print-defmt"], optional = true }
static_cell = "2.1.0"
messages = { path = "../messages/" }
bitfield = "0.17.0"

[[bin]]
name = "tool_board"
test = false
bench = false

[profile.dev]
debug = true
lto = true
opt-level = "s"
incremental = false
codegen-units = 1

[profile.release]
debug = true
codegen-units = 1
lto = true
opt-level = "s"
incremental = false

[features]
defmt = ["dep:defmt"]
defmt-rtt = ["dep:defmt-rtt"]
panic-probe = ["dep:panic-probe"]
default = ["debug"]
debug = [
    "defmt",
    "defmt-rtt",
    "panic-probe",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
]

[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "227e073fca97bcbcec42d9705e0a8ef19fc433b5" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "227e073fca97bcbcec42d9705e0a8ef19fc433b5" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "227e073fca97bcbcec42d9705e0a8ef19fc433b5" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "227e073fca97bcbcec42d9705e0a8ef19fc433b5" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "227e073fca97bcbcec42d9705e0a8ef19fc433b5" }
