[pytest]
asyncio_mode = auto
log_level = WARNING
# pytest-asyncio runs every async test and fixture. With AnyIO's plugin also
# loaded, a plain async fixture of an anyio-marked test goes to whichever plugin
# registered last (site-packages order), which can start it on another loop.
# A root-level run picks this file up; the per-package pytest.ini files stay
# authoritative for runs started inside a package.
addopts = -p no:anyio
markers =
	anyio: legacy async test mark; pytest-asyncio auto mode runs these tests
